[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-env>=1.8.3",
    "types-ujson>=5.10.0.20250822",
]

[project]
authors = []
dependencies = [
    "fastapi[standard]>=0.120.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=3.8.1",
    "numpy>=2.3.4",
    "onnxruntime>=1.24.4",
    "openai>=2.6.1",
    "pydantic>=2.12.3",
    "rich>=14.2.0",
    "sentence-transformers>=5.3.0",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "ujson>=5.12.0"
]
description = "mlprofiler - The ML pipelines profiler"
name = "mlprofiler"
readme = "README.md"
requires-python = ">=3.12.0,<4.0"
version = "0.3.0"

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest_env]
LANGFUSE_SECRET_KEY=""
LANGFUSE_PUBLIC_KEY=""
LANGFUSE_BASE_URL="http://langfuse-web:3000"
LANGFUSE_FLUSH_AT=1
VLLM_FORCE=0
VLLM_LLM_MODEL_ID='Qwen/Qwen2.5-7B-Instruct-AWQ'
VLLM_LLM_QUANTIZATION='awq'
LLM_INFERENCE_API_URL=''
