repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.4.4
  hooks:
  - id: ruff
    args: [--fix, --select, "I"]
  #- id: ruff-format

- repo: local
  hooks:
  - id: pyright
    name: pyright
    entry: uv run --group dev pyright
    language: system
    types: [python]
    pass_filenames: false

- repo: https://github.com/hadolint/hadolint
  rev: v2.12.0
  hooks:
  - id: hadolint-docker
    args: [--failure-threshold, warning]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-merge-conflict
  - id: check-added-large-files
    args: [--maxkb=1000]
  - id: debug-statements

- repo: local
  hooks:
  - id: pytest-check
    name: pytest-check
    entry: bash -c 'uv run pytest'
    language: system
